site_name: Unity 개발자를 위한 GitHub 실무 교과서
# Keep the original offline site/ reader separate from MkDocs build output.
site_dir: _mkdocs_site
site_description: Unity 프로젝트의 형상 관리, 팀 협업, 요구사항 관리, GitHub Projects, Actions, 품질 검증과 출시 자동화
site_author: OpenAI
site_url: https://YOUR_ACCOUNT.github.io/YOUR_REPOSITORY/
repo_url: https://github.com/YOUR_ACCOUNT/YOUR_REPOSITORY
repo_name: YOUR_ACCOUNT/YOUR_REPOSITORY
copyright: "교육용 문서 · 2026-10-24 보강 · 사용 전 버전 및 공식 정책 확인"
theme:
  name: material
  language: ko
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.path
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - scheme: default
      primary: indigo
      accent: teal
      toggle:
        icon: material/brightness-7
        name: 다크 모드 전환
    - scheme: slate
      primary: indigo
      accent: teal
      toggle:
        icon: material/brightness-4
        name: 라이트 모드 전환
plugins:
  - search:
      lang: ko
markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.highlight:
      anchor_linenums: true
extra:
  generator: false
nav:
  - 시작하기: index.md
  - A · Git과 GitHub 기초:
      - 01 Git의 기본 원리: part-a/01-git-fundamentals.md
      - 02 GitHub 기본 사용법: part-a/02-github-basics.md
  - B · Unity 프로젝트 관리:
      - 03 Unity 저장소 구성: part-b/03-unity-repository.md
      - 04 대용량 에셋과 충돌: part-b/04-lfs-merge-uvcs.md
  - C · 팀 협업:
      - 05 브랜치와 Pull Request: part-c/05-branch-pr-review.md
  - D · 요구사항과 작업:
      - 06 GitHub Issues: part-d/06-issues.md
      - 07 GitHub Projects: part-d/07-projects.md
      - 07-A 알림 관리: part-d/07a-notifications.md
      - 07-B Discussions와 상태 보고: part-d/07b-discussions-status.md
  - E · 자동화와 빌드:
      - 08 GitHub Actions: part-e/08-actions.md
      - 09 Unity 테스트와 CI: part-e/09-unity-tests-ci.md
      - 10 Unity 자동 빌드와 CD: part-e/10-unity-build-release.md
  - F · 운영과 확장:
      - 11 문서·릴리스·보안: part-f/11-docs-release-security.md
      - 11-A 코드 검색·Dependabot·보안: part-f/11a-code-search-security.md
      - 12 고급 자동화·AI·연동: part-f/12-automation-ai-integration.md
  - 참고 자료:
      - 종합 실습: appendix/integrated-lab.md
      - 문제 해결: appendix/troubleshooting.md
      - 용어 사전: appendix/glossary.md
      - 재사용 템플릿: appendix/templates.md
      - 공식 문서와 검증 범위: appendix/references.md
      - GitHub Pages 게시: appendix/publishing.md
