name: 버그 보고
description: 재현 가능한 버그를 기록합니다.
title: "[Bug] "
labels: ["bug"]
body:
  - type: input
    id: build
    attributes:
      label: 발견한 빌드/커밋
      placeholder: "0.3.4 / abc1234"
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 재현 절차
      description: 번호를 붙여 정확한 조작 순서와 조건을 기록합니다.
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: 실제 결과
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 기대 결과
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 로그·영상·스크린샷
      description: 민감 정보와 개인정보를 제거한 뒤 첨부합니다.
