name: 기능 개발
description: 새로운 게임 기능의 목적·범위·완료 기준을 기록합니다.
title: "[Feature] "
labels: ["feature"]
body:
  - type: textarea
    id: goal
    attributes:
      label: 플레이어 관점의 목표
      description: 어떤 경험을 만들기 위한 기능인가요?
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 작업 범위와 제외 범위
      description: 이번 작업에서 포함·제외할 내용을 작성하세요.
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: 기획·설계·선행 작업 링크
      description: 연결되는 Issue와 문서 링크를 적습니다.
  - type: textarea
    id: done
    attributes:
      label: 완료 조건
      value: |
        - [ ] 기능 동작 확인
        - [ ] 예외 상황 확인
        - [ ] Unity 빌드에서 검증
    validations:
      required: true
